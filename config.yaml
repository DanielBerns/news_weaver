database:
  data_db_url: "sqlite:///data.db"
  pipeline_db_url: "sqlite:///pipeline.db"

api:
  host: "127.0.0.1"
  port: 8000
  # secret_key is NOT stored here. Set the NEWS_WEAVER_SECRET_KEY environment variable.

logging:
  file: "pipeline.log"  # relative to project root (where cron wrappers cd to)
  level: "INFO"

system:
  project_root: "."  # resolved to absolute Path at runtime
  uv_path: "uv"      # relies on PATH; override if uv is not on PATH
  scraped_data_dir: "scraped_data"
